:root{--bg:#141414;--panel:#1d1d1d;--line:#2e2e2e;--ink:#eee;--mute:#8a8a8a;--accent:#EB5E2D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 18px 40px}
h1{font-family:"alternate-gothic-atf","Arial Narrow",sans-serif;font-weight:700;font-size:26px;letter-spacing:.01em;margin:0 0 2px;text-transform:uppercase}
.sub{color:var(--mute);font-size:12px;margin-bottom:18px}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 6px}
legend{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0 6px 0 0}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
input[type=text],textarea{width:100%;background:#111;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font:inherit}
textarea{resize:vertical;min-height:52px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px}.row>div{flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff}
input[type=color]{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#2a2a2a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:#555}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;width:100%;padding:12px;margin-top:16px}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;margin-top:8px}
.hint{font-size:11px;color:var(--mute);margin-top:6px}
main{display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;position:relative}
main{min-width:0}
#stage{display:block;width:min(100%, calc((100vh - 56px) * 0.8));height:auto;aspect-ratio:1080/1350;box-shadow:0 20px 60px rgba(0,0,0,.5);touch-action:none}
input.greyRange{-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;background:linear-gradient(90deg,#fff,#000);margin:8px 0}
input.greyRange::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff}
input.greyRange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:4px}
.seg button{flex:1;background:#111;color:var(--mute);border:0;padding:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#000}
label .v{float:right;color:#cfcfcf;font-variant-numeric:tabular-nums}
#stage.grab{cursor:grab}#stage.grabbing{cursor:grabbing!important}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}main{order:-1;padding:12px}#stage{width:100%}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:16px}.back:hover{color:var(--ink);border-color:#555}
</style>
</head>
<body>
<div class="app">
<aside>
  <a class="back" href="index.html">&larr; Back to brand tools</a>
  <h1>What's On</h1>
  <div class="sub">1080 × 1350 PNG · Jubel Wednesdays template</div>

  <fieldset><legend>Top</legend>
    <label>Kicker</label><input type="text" id="kicker">
    <label>Script title</label><input type="text" id="title">
    <label class="check"><input type="checkbox" id="swash"> Swash endings</label>
    <label>Title size</label><input type="range" id="titleScale" min="60" max="110" value="100">
    <label>Subtitle</label><input type="text" id="subtitle">
  </fieldset>

  <fieldset><legend>Photo</legend>
    <div class="row">
      <button class="btn" id="pick" style="flex:1">Upload photo</button>
      <button class="btn" id="clearImg">Remove</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="hint">Click the black box to add a photo. Drag it to move, scroll over it to resize.</div>
    <label>Size <span class="v" id="zoomV">100%</span></label><input type="range" id="zoom" min="50" max="300" value="100">
    <label class="check"><input type="checkbox" id="film"> Film look (Funsaver Ultramax 800)</label>
    <label class="check"><input type="checkbox" id="bw"> Black &amp; white</label>
    <label>Exposure <span class="v" id="exposureV">0.00</span></label><input type="range" id="exposure" min="-200" max="200" value="0">
    <label>Grain <span class="v" id="grainV">0</span></label><input type="range" id="grain" min="0" max="20" value="0">
    <button class="btn" id="resetPhoto" style="margin-top:10px;width:100%">Reset photo adjustments</button>
  </fieldset>

  <fieldset><legend>Sides &amp; footer</legend>
    <div class="row">
      <div><label>Left</label><textarea id="left"></textarea></div>
      <div><label>Right</label><textarea id="right"></textarea></div>
    </div>
    <label>Footer line</label><input type="text" id="footer">
    <label>Address (two lines)</label><textarea id="address" rows="2"></textarea>
  </fieldset>

  <fieldset><legend>Colour</legend>
    <label>Background</label>
    <div class="seg" id="bgMode"><button data-v="1">Solid</button><button data-v="2">2 colours</button><button data-v="3">3 colours</button></div>
    <label id="bgL1">Colour</label><div class="swatches" id="bgSw"></div>
    <div id="bg2W"><label>Gradient bottom</label><div class="swatches" id="bg2Sw"></div></div>
    <div id="bg3W"><label>Gradient bottom</label><div class="swatches" id="bg3Sw"></div></div>
    <label>Ink</label>
    <div class="swatches" id="inkSw"></div>
    <label class="check"><input type="checkbox" id="logo" checked> Show THE CORNER, CLAPHAM</label>
  </fieldset>

  <fieldset><legend>Border</legend>
    <label class="check"><input type="checkbox" id="border"> Blurred border</label>
    <label>Border colour <span class="v" id="greyV"></span></label>
    <input type="range" id="grey" min="0" max="100" value="27" class="greyRange">
  </fieldset>

  <fieldset><legend>Paper</legend>
    <label class="check"><input type="checkbox" id="paper"> Paper texture</label>
    <label>Strength <span class="v" id="paperAmtV"></span></label><input type="range" id="paperAmt" min="5" max="100" value="40">
    <button class="btn" id="paperNew" type="button" style="width:100%;margin-top:6px">New texture</button>
  </fieldset>

  <button class="btn primary" id="download">Download PNG</button>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="reset" style="flex:1">Reset to template</button>
  </div>
</aside>
<main>
  <canvas id="stage" width="1080" height="1350"></canvas>
</main>
</div>

const capCache={};
function capRatio(font){ // cap height per px of font-size

  let f=gothic(weight,cap);const k=fitWidth(str,f,maxW);

  textC(str,x,base,f);
}

// ---------- render ----------
// content scale when the blurred border is on: content shrinks to sit inside the frame
function frameK(){return S.border?1-2*(BORDER_SIZE+BORDER_SOFT*0.35)/W:1}
function bgFill(c){ // solid colour or top-to-bottom gradient
  if(S.bgMode==='1')return S.bg;
  const g=c.createLinearGradient(0,0,0,H);
  if(S.bgMode==='2'){g.addColorStop(0,S.bg);g.addColorStop(1,S.bg2)}
  else{g.addColorStop(0,S.bg);g.addColorStop(0.5,S.bg2);g.addColorStop(1,S.bg3)}
  return g;
}
let panelCv=null;
function drawBackground(){
  if(!S.border){ctx.fillStyle=bgFill(ctx);ctx.fillRect(0,0,W,H);return}
  ctx.fillStyle=greyHex(S.grey);ctx.fillRect(0,0,W,H);
  const i=BORDER_SIZE,r=Math.min(60,i*0.6),blur=BORDER_SOFT*1.2,off=W*4;
  // soft panel: blur a white shape via shadow (works in every browser, unlike ctx.filter),
  // then paint the background colour or gradient into it
  panelCv=panelCv||Object.assign(document.createElement('canvas'),{width:W,height:H});
  const p=panelCv.getContext('2d');p.clearRect(0,0,W,H);
  p.save();p.shadowColor='#fff';p.shadowBlur=blur;p.shadowOffsetX=off;
  p.fillStyle='#fff';p.beginPath();p.roundRect(i-off,i,W-2*i,H-2*i,r);p.fill();p.restore();
  if(blur<1){p.fillStyle='#fff';p.beginPath();p.roundRect(i,i,W-2*i,H-2*i,r);p.fill()}
  p.globalCompositeOperation='source-in';p.fillStyle=bgFill(p);p.fillRect(0,0,W,H);p.globalCompositeOperation='source-over';
  ctx.drawImage(panelCv,0,0);
}
function render(forExport){
  drawBackground();
  const k=frameK();
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-W/2,-H/2);
  renderContent(forExport);
  ctx.restore();
  if(S.paper)Paper.apply(ctx,W,H,S.paperSeed,S.paperAmt/100,()=>render());
}
function renderContent(forExport){
  ctx.fillStyle=S.ink;
  const up=s=>(s||'').toUpperCase();

  // kicker
  gothicFit(up(S.kicker),700,40,W/2,98,900);

  // script title: fit width, capped by height
  if(S.title){
    // swash endings: everything but the final letter uses swash forms; the final letter stays plain for balance
    const t=S.title,end=t.search(/\S\s*$/);
    const runs=(S.swash&&end>0)?[[t.slice(0,end),SWASH],[t.slice(end),SCRIPT]]:[[t,SCRIPT]];
    let tw=0,ta=0,td=0;
    for(const [str,f] of runs){ctx.font='100px '+f;const m=ctx.measureText(str);tw+=m.width;ta=Math.max(ta,m.actualBoundingBoxAscent);td=Math.max(td,m.actualBoundingBoxDescent)}
    ctx.font='100px '+SCRIPT;
    const asc=ctx.measureText('W').actualBoundingBoxAscent||70;
    const base=Math.min(1035/tw*100, 216/asc*100), k=S.titleScale/100, size=base*k;
    // anchor on the word's vertical middle at default size, so the size slider grows/shrinks from there
    const mid=(td-ta)/100*base/2; // offset of middle from baseline at base size
    const baseline=317+mid-mid*k;
    ctx.save();ctx.textAlign='left';
    let x=W/2-tw*size/100/2;
    for(const [str,f] of runs){ctx.font=size+'px '+f;ctx.fillText(str,x,baseline);x+=ctx.measureText(str).width}
    ctx.restore();
  }

  // vertical rhythm: subtitle, photo, footer, address and venue line are spaced by one equal gap G,
  // with the photo kept where it is (centred on the poster)
  const V=vstack();
  // subtitle
  gothicFit(up(S.subtitle),700,V.subCap,W/2,V.subBase,980);

  // image box
  ctx.save();ctx.beginPath();ctx.rect(BOX.x,BOX.y,BOX.w,BOX.h);ctx.clip();
  ctx.fillStyle='#000';ctx.fillRect(BOX.x,BOX.y,BOX.w,BOX.h);
  if(img&&proc){
    const base=Math.max(BOX.w/proc.width,BOX.h/proc.height)*zoom;
    const dw=proc.width*base,dh=proc.height*base;
    clampPan(dw,dh);
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(proc,BOX.x+(BOX.w-dw)/2+pan.x,BOX.y+(BOX.h-dh)/2+pan.y,dw,dh);
    if(S.grain>0){
      ctx.globalCompositeOperation='overlay';ctx.globalAlpha=Math.min(1,S.grain/100);
      ctx.drawImage(grainTile(),BOX.x,BOX.y,BOX.w,BOX.h);
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }
  }else if(!forExport){
    ctx.fillStyle='#6b6b6b';gothicFit('+ ADD PHOTO',700,26,BOX.x+BOX.w/2,BOX.y+BOX.h/2+13,BOX.w-40);
  }
  ctx.restore();
  ctx.fillStyle=S.ink;

  // sides
  sideBlock(up(S.left),153);
  sideBlock(up(S.right),917);

  // footer
  gothicFit(up(S.footer),700,V.footCap,W/2,V.footBase,980);

  // address, up to two lines
  ctx.letterSpacing='0.6px';V.addr.forEach((l,i)=>gothicFit(l,300,V.addrCap,W/2,V.addrBase[i],900));ctx.letterSpacing='0px';

  // venue line, set as on the Dense Type poster: Alternate Gothic ATF 700, centred
  if(S.logo)textC(VENUE,W/2,V.venueBase,V.venueFont);
}
function vstack(){
  const subCap=67,footCap=74,addrCap=42,addrLead=addrCap*0.45,bottom=H-58; // bottom margin matches WHAT'S ON's top
  const addr=(S.address||'').toUpperCase().split('\n').map(l=>l.trim()).filter(Boolean).slice(0,2);
  ctx.font='700 100px '+GOTHIC;const k=620/ctx.measureText(VENUE).width;
  const venueFont='700 '+(100*k).toFixed(2)+'px '+GOTHIC;ctx.font=venueFont;const venueCap=ctx.measureText('H').actualBoundingBoxAscent;
  const addrH=addr.length?addr.length*addrCap+(addr.length-1)*addrLead:0;
  // JUBEL and WEDNESDAYS sit a fixed, tighter gap from the photo; THE CORNER, CLAPHAM sits on the
  // bottom margin; the address is centred in the space between WEDNESDAYS and the venue line
  const G=40, footBase=BOX.y+BOX.h+G+footCap;
  const end=S.logo?bottom-venueCap:bottom; // top of the venue line, or the bottom margin without it
  const g2=Math.max(12,(end-footBase-addrH)/2);
  const addrBase=[];let y=footBase;
  if(addr.length){y+=g2+addrCap;addrBase.push(y);if(addr[1]){y+=addrLead+addrCap;addrBase.push(y)}}
  y=bottom;
  return{subCap,subBase:BOX.y-G,footCap,footBase,addr,addrCap,addrBase,venueFont,venueBase:y};
}
function sideBlock(str,cx){
  const lines=str.split('\n').filter(l=>l.trim()!=='').slice(0,4);
  if(!lines.length)return;
  const cap=37,lead=48;
  let f=gothic(700,cap,GOTHIC_COND);
  ctx.font=f;
  const widest=Math.max(...lines.map(l=>ctx.measureText(l).width));
  if(widest>250)f=gothic(700,cap*250/widest,GOTHIC_COND);
  const mid=(BOX.y+BOX.h/2)+4;
  const top=mid-((lines.length-1)*lead)/2+cap/2;
  lines.forEach((l,i)=>textC(l,cx,top+i*lead,f));
}
function clampPan(dw,dh){
  const mx=Math.abs(dw-BOX.w)/2,my=Math.abs(dh-BOX.h)/2;
  pan.x=Math.max(-mx,Math.min(mx,pan.x));pan.y=Math.max(-my,Math.min(my,pan.y));
}

// ---------- photo processing ----------
let src=null,srcData=null,proc=null,procQueued=false,grainCv=null;
function grainTile(){
  if(grainCv)return grainCv;
  const gw=Math.round(BOX.w/1.3),gh=Math.round(BOX.h/1.3);
  grainCv=document.createElement('canvas');grainCv.width=gw;grainCv.height=gh;
  const g=grainCv.getContext('2d'),d=g.createImageData(gw,gh);
  let seed=1337;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<d.data.length;i+=4){
    const n=(rnd()+rnd()+rnd()-1.5)*2; // approx gaussian
    const v=Math.max(0,Math.min(255,128+n*50));
    d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;
  }
  g.putImageData(d,0,0);return grainCv;
}
function setPhoto(i){
  const k=Math.min(1,1600/Math.max(i.width,i.height));
  src=document.createElement('canvas');src.width=Math.round(i.width*k);src.height=Math.round(i.height*k);
  const g=src.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(i,0,0,src.width,src.height);
  srcData=g.getImageData(0,0,src.width,src.height);
  proc=document.createElement('canvas');proc.width=src.width;proc.height=src.height;
  img=i;pan={x:0,y:0};zoom=1;$('zoom').value=100;$('zoomV').textContent='100%';
  cv.style.cursor='grab';processPhoto(true);
}
function processPhoto(now){
  if(!srcData)return;
  if(!now){if(procQueued)return;procQueued=true;requestAnimationFrame(()=>{procQueued=false;processPhoto(true)});return}
  const lut=buildLUT(S.film,S.exposure/100+(S.film?0.5:0),S.bw);
  const N=LUT_N,M=N-1,o=new ImageData(srcData.width,srcData.height),a=srcData.data,b=o.data;
  for(let i=0;i<a.length;i+=4){
    const r=a[i]/255*M,g=a[i+1]/255*M,bl=a[i+2]/255*M;
    const r0=r|0,g0=g|0,b0=bl|0,r1=r0<M?r0+1:M,g1=g0<M?g0+1:M,b1=b0<M?b0+1:M;
    const fr=r-r0,fg=g-g0,fb=bl-b0;
    for(let c=0;c<3;c++){
      const L=(x,y,z)=>lut[((x*N+y)*N+z)*3+c];
      const c00=L(r0,g0,b0)*(1-fr)+L(r1,g0,b0)*fr, c10=L(r0,g1,b0)*(1-fr)+L(r1,g1,b0)*fr;
      const c01=L(r0,g0,b1)*(1-fr)+L(r1,g0,b1)*fr, c11=L(r0,g1,b1)*(1-fr)+L(r1,g1,b1)*fr;
      const v=(c00*(1-fg)+c10*fg)*(1-fb)+(c01*(1-fg)+c11*fg)*fb;
      b[i+c]=v*255;
    }
    b[i+3]=a[i+3];
  }
  proc.getContext('2d').putImageData(o,0,0);render();
}

// Approximation of the Lightroom preset "+0.5 Funsaver Kodak Ultramax 800 no grain"
const XMP={hl:-45,sh:20,wh:-30,sat:-5,
  hue:[15,-5,5,20,10,-5,20,20], satB:[-30,-25,-25,-55,0,-20,-35,-35], lum:[5,5,10,0,10,-20,20,15],
  calib:{rH:25,rS:65,gH:25,gS:-20,bH:-10,bS:-15},
  curve:[[0,26],[25,33],[79,75],[133,133],[189,191],[255,245]],
  curveR:[[0,0],[33,14],[79,64],[117,121],[174,195],[255,255]],
  curveG:[[0,0],[35,18],[115,119],[177,204],[255,255]],
  curveB:[[0,0],[33,14],[113,118],[175,200],[255,249]]};
const LUT_N=33;
function curveLUT(pts){ // monotone cubic (Fritsch-Carlson), 1024 steps
  const x=pts.map(p=>p[0]/255),y=pts.map(p=>p[1]/255),n=x.length,d=[],m=[];
  for(let i=0;i<n-1;i++)d.push((y[i+1]-y[i])/(x[i+1]-x[i]));
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],h=a*a+b*b;if(h>9){const t=3/Math.sqrt(h);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}

  for(let k=0;k<=1024;k++){const t=k/1024;let i=0;while(i<n-2&&t>x[i+1])i++;
    const h=x[i+1]-x[i],u=(t-x[i])/h,u2=u*u,u3=u2*u;
    out[k]=Math.min(1,Math.max(0,(2*u3-3*u2+1)*y[i]+(u3-2*u2+u)*h*m[i]+(-2*u3+3*u2)*y[i+1]+(u3-u2)*h*m[i+1]))}
  return out;
}
const CURVES={m:curveLUT(XMP.curve),r:curveLUT(XMP.curveR),g:curveLUT(XMP.curveG),b:curveLUT(XMP.curveB)};
const cv1=(L,v)=>L[Math.round(Math.min(1,Math.max(0,v))*1024)];
const toLin=v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);
const toGam=v=>v<=0.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-0.055;
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
function rgb2hsl(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
  return[h,s,l]}
function hsl2rgb(h,s,l){h=((h%360)+360)%360/360;if(s===0)return[l,l,l];
  const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t<0&&(t+=1);t>1&&(t-=1);return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
  return[f(h+1/3),f(h),f(h-1/3)]}
const BAND=[0,30,60,120,180,240,270,300,360];
function bandW(h){const w=new Float32Array(8);
  for(let i=0;i<8;i++){const a=BAND[i],b=BAND[i+1];if(h>=a&&h<=b){const t=(h-a)/(b-a);w[i]+=1-t;w[(i+1)%8]+=t;break}}return w}
function calibMatrix(){
  const c=XMP.calib,prim=[[1,0,0,c.rH,c.rS],[0,1,0,c.gH,c.gS],[0,0,1,c.bH,c.bS]],cols=[];
  for(const [r,g,b,hh,ss] of prim){
    const [h,s,l]=rgb2hsl(r,g,b);let [r2,g2,b2]=hsl2rgb(h+hh*0.25,s,l);
    const sum=r2+g2+b2,gr=sum/3,k=1+ss/100*0.35;

const CALIB=calibMatrix();
function pixel(r,g,b,film,ev){

}
let lutKey='',lutCache=null;
function buildLUT(film,ev,bw){

// ---------- paper ----------
// ---------- paper texture ----------
// Overlays assets/images/paper.webp (1240 x 1712, transparent) at normal blend.
// Loaded only when first switched on. Each seed picks a different crop and flip of the image,
// so "New texture" gives a different-looking sheet; the same seed always gives the same result.
const Paper={
  url:'assets/images/paper.webp',img:null,loading:false,
  rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}},
  newSeed(){return 1+Math.floor(Math.random()*2147483646)},
  load(done){
    if(this.img||this.loading)return;
    this.loading=true;
    const i=new Image();
    i.onload=()=>{this.img=i;this.loading=false;done&&done()};
    i.onerror=()=>{this.loading=false};
    i.src=this.url;
  },
  // amt 0..1. Returns false if the image is still loading (done() is called when it arrives).
  apply(c,w,h,seed,amt,done){
    if(!(amt>0))return true;
    if(!this.img){this.load(done);return false}
    const i=this.img,r=this.rng(seed),fx=r()<.5,fy=r()<.5;
    const k=Math.max(w/i.width,h/i.height),sw=w/k,sh=h/k;
    const sx=r()*(i.width-sw),sy=r()*(i.height-sh);
    c.save();c.globalAlpha=amt;
    c.translate(fx?w:0,fy?h:0);c.scale(fx?-1:1,fy?-1:1);
    c.drawImage(i,sx,sy,sw,sh,0,0,w,h);
    c.restore();
    return true;
  }
};

function setZoom(z){zoom=Math.max(0.5,Math.min(3,z));$('zoom').value=Math.round(zoom*100);$('zoomV').textContent=Math.round(zoom*100)+'%';render()}
$('zoom').addEventListener('input',e=>setZoom(e.target.value/100));
$('border').addEventListener('change',e=>{S.border=e.target.checked;render();save()});
$('grey').addEventListener('input',e=>{S.grey=+e.target.value;borderUI();render();save()});
$('bw').addEventListener('change',e=>{S.bw=e.target.checked;processPhoto();save()});
$('film').addEventListener('change',e=>{S.film=e.target.checked;processPhoto();save()});
$('exposure').addEventListener('input',e=>{S.exposure=+e.target.value;photoUI();processPhoto();save()});
$('grain').addEventListener('input',e=>{S.grain=+e.target.value;photoUI();render();save()});
$('resetPhoto').onclick=()=>{S.film=DEFAULTS.film;S.bw=false;S.exposure=0;S.grain=DEFAULTS.grain;photoUI();pan={x:0,y:0};setZoom(1);processPhoto();save()};

function swatches(id,list,key){
  const el=$(id);el.innerHTML='';
  list.forEach(c=>{const b=document.createElement('button');b.className='sw'+(S[key].toLowerCase()===c.toLowerCase()?' on':'');b.style.background=c;b.title=c;
    if(c.toLowerCase()==='#111111'||c==='#000000')b.style.boxShadow='inset 0 0 0 1px #444';
    b.onclick=()=>{S[key]=c;syncUI();render();save()};el.appendChild(b)});
  const p=document.createElement('input');p.type='color';p.value=S[key];
  p.oninput=e=>{S[key]=e.target.value;render();save()};p.onchange=()=>syncUI();el.appendChild(p);
}

function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>setPhoto(i);i.src=r.result};r.readAsDataURL(f);
}
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
$('clearImg').onclick=()=>{img=null;src=srcData=proc=null;render()};
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});

// drag to pan
function toCanvas(e){const r=cv.getBoundingClientRect(),k=frameK();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;return{x:(x-W/2)/k+W/2,y:(y-H/2)/k+H/2}}
let drag=null;
const inBox=p=>p.x>=BOX.x&&p.x<=BOX.x+BOX.w&&p.y>=BOX.y&&p.y<=BOX.y+BOX.h;
cv.addEventListener('pointerdown',e=>{
  const p=toCanvas(e);if(!inBox(p))return;
  if(!img){$('file').click();return}
  drag={sx:p.x,sy:p.y,px:pan.x,py:pan.y};cv.setPointerCapture(e.pointerId);cv.classList.add('grabbing');
});
cv.addEventListener('pointermove',e=>{const p=toCanvas(e);
  if(!drag){cv.style.cursor=inBox(p)?(img?'grab':'pointer'):'default';return}pan.x=drag.px+(p.x-drag.sx);pan.y=drag.py+(p.y-drag.sy);render()});
cv.addEventListener('pointerup',()=>{drag=null;cv.classList.remove('grabbing')});
cv.addEventListener('wheel',e=>{if(!img||!inBox(toCanvas(e)))return;e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*0.0015))},{passive:false});

$('download').onclick=()=>{
  render(true);
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    const slug=(S.title||'poster').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    a.download='the-corner-'+slug+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);render()},'image/png');
};
$('reset').onclick=()=>{S=Object.assign({},DEFAULTS);syncUI();loadDefaultPhoto();save()};

// ---------- fonts ----------
syncUI();render();loadDefaultPhoto();
Promise.allSettled([300,600,700,800,900].map(w=>document.fonts.load(w+' 40px "alternate-gothic-atf"')).concat(document.fonts.load('700 40px "alternate-gothic-condensed-a"'),document.fonts.load('40px "Calgary Script"'),document.fonts.load('40px "Calgary Script Swash"'))).then(()=>{for(const k in capCache)delete capCache[k];render()});
document.fonts.addEventListener('loadingdone',()=>{for(const k in capCache)delete capCache[k];render()});
</script>
</body>
</html>
